<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Command Center</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; color: #333; max-width: 500px; margin: auto; }
        .banner { background: #dc3545; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: block; text-decoration: none; color: #333; font-weight: bold; border-left: 5px solid #007bff; }
        .shift-item { background: #e7f3ff; padding: 10px; margin-bottom: 8px; border-radius: 8px; font-size: 0.9em; border: 1px solid #cce5ff; }
    </style>
</head>
<body>
    <div id="banner" class="banner">⚠️ Openstaande shiften laden...</div>
    <h1 id="welkom">👋 Hey...</h1>
    
    <div id="shiften-lijst">
        <h3>📅 Jouw geplande shiften:</h3>
        <div id="data">Laden...</div>
    </div>

    <a href="https://docs.google.com/spreadsheets/d/13LXagLh7Q1SJknFzQfhfAm-CLy6DyTQhVNUvzpwMcvQ/edit" class="card">📂 Volledige shiftenlijst (Invullen)</a>
    <a href="https://wa.me/32473378417" class="card" style="border-left-color: #28a745;">📞 Contact Coördinator</a>
    <a href="#" class="card" style="border-left-color: #ffc107;">🤖 AI Hulp (Gemini)</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const naam = params.get('naam') || 'Vrijwilliger';
        document.getElementById('welkom').innerText = '👋 Hey ' + naam.charAt(0).toUpperCase() + naam.slice(1);

        async function laadData() {
            // VERVANG DEZE LINK DOOR JOUW CSV PUBLICATIE LINK
            const csvUrl = 'HIER_DE_CSV_LINK_PLAKKEN'; 
            
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rijen = data.split('\n');
                
                let htmlMijnShiften = '';
                let eersteOpenShift = 'Geen open shiften gevonden';

                rijen.forEach((rij) => {
                    // Filter jouw shiften
                    if (rij.toLowerCase().includes(naam.toLowerCase())) {
                        htmlMijnShiften += `<div class="shift-item">${rij.replace(/,/g, ' ')}</div>`;
                    }
                    // Eenvoudige check voor open shiften (rijen met tijden maar zonder namen)
                    if (eersteOpenShift === 'Geen open shiften gevonden' && rij.includes('u') && !rij.toLowerCase().includes('michael') && !rij.toLowerCase().includes('sacha') && !rij.toLowerCase().includes('cederic') && !rij.toLowerCase().includes('axel') && !rij.toLowerCase().includes('zoë')) {
                         eersteOpenShift = rij.replace(/,/g, ' ');
                    }
                });
                document.getElementById('data').innerHTML = htmlMijnShiften || 'Geen persoonlijke shiften gevonden.';
                document.getElementById('banner').innerText = '🔥 Volgende open shift: ' + eersteOpenShift;
            } catch (e) {
                document.getElementById('banner').innerText = '⚠️ Kon data niet laden (Publiceer je sheet als CSV).';
            }
        }
        laadData();
    </script>
</body>
</html>
