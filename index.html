<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>JC Command Center</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; color: #333; max-width: 500px; margin: auto; }
        .banner { background: #dc3545; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: block; text-decoration: none; color: #333; font-weight: bold; border-left: 5px solid #007bff; }
        .shift-item { background: #e7f3ff; padding: 10px; margin-bottom: 8px; border-radius: 8px; font-size: 0.9em; border: 1px solid #cce5ff; }
    </style>
</head>
<body>
    <div id="banner" class="banner">Laden...</div>
    <h1 id="welkom">👋 Hey...</h1>
    
    <div id="shiften-lijst">
        <h3>📅 Jouw geplande shiften:</h3>
        <div id="data">Laden...</div>
    </div>

    <a href="https://docs.google.com/spreadsheets/d/13LXagLh7Q1SJknFzQfhfAm-CLy6DyTQhVNUvzpwMcvQ/edit" class="card">📂 Volledige shiftenlijst (Invullen)</a>
    <a href="https://wa.me/32473378417" class="card" style="border-left-color: #28a745;">📞 Contact Coördinator</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const naam = (params.get('naam') || 'Vrijwilliger').toLowerCase();
        document.getElementById('welkom').innerText = '👋 Hey ' + naam.charAt(0).toUpperCase() + naam.slice(1);

        const sheetId = '13LXagLh7Q1SJknFzQfhfAm-CLy6DyTQhVNUvzpwMcvQ';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(url)
            .then(res => res.text())
            .then(text => {
                // Strip Google's JSON wrapper
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const rijen = json.table.rows;
                
                let mijnShiften = [];
                let eersteOpen = "Geen";

                rijen.forEach(r => {
                    const rowData = r.c.map(c => (c && c.v) ? String(c.v) : '').join(' ');
                    
                    if (rowData.toLowerCase().includes(naam)) {
                        mijnShiften.push(rowData);
                    }
                    if (eersteOpen === "Geen" && rowData.includes('u') && !/michael|sacha|cederic|axel|zoe|ferre/i.test(rowData)) {
                        eersteOpen = rowData;
                    }
                });

                document.getElementById('data').innerHTML = mijnShiften.length > 0 
                    ? mijnShiften.map(s => `<div class="shift-item">${s}</div>`).join('') 
                    : 'Geen shiften gevonden.';
                document.getElementById('banner').innerText = '🔥 Volgende open shift: ' + eersteOpen;
            });
    </script>
</body>
</html>
