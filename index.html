<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Command Center</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; padding: 20px; color: #333; max-width: 500px; margin: auto; }
        .banner { background: #dc3545; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; font-weight: bold; text-align: center; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); }
        .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: block; text-decoration: none; color: #333; font-weight: 600; border-left: 6px solid #007bff; }
        .shift-item { background: #e7f3ff; padding: 12px; margin-bottom: 8px; border-radius: 8px; font-size: 0.95em; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <div id="banner" class="banner">Planning ophalen...</div>
    <h1 id="welkom">👋 Hey...</h1>
    <div id="data">Laden...</div>

    <a href="https://docs.google.com/spreadsheets/d/13LXagLh7Q1SJknFzQfhfAm-CLy6DyTQhVNUvzpwMcvQ/edit" class="card">📂 Volledige shiftenlijst</a>
    <a href="https://wa.me/32473378417" class="card" style="border-left-color: #28a745;">📞 Contact Jeugdwerker</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const naam = (params.get('naam') || 'Vrijwilliger').toLowerCase();
        document.getElementById('welkom').innerText = '👋 Hey ' + naam.charAt(0).toUpperCase() + naam.slice(1);

        fetch(`https://docs.google.com/spreadsheets/d/13LXagLh7Q1SJknFzQfhfAm-CLy6DyTQhVNUvzpwMcvQ/gviz/tq?tqx=out:json`)
            .then(res => res.text())
            .then(text => {
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const rijen = json.table.rows;
                let mijnShiften = [], eersteOpen = null;

                rijen.forEach(r => {
                    // Pak alle celwaarden, filter lege weg en maak er een mooie zin van
                    const rowData = r.c.filter(c => c && c.v).map(c => c.v).join(' | ');
                    
                    if (rowData.toLowerCase().includes(naam)) mijnShiften.push(rowData);
                    
                    // Filter: bevat tijd ('u') EN geen naam + minstens 10 tekens
                    if (!eersteOpen && /u/i.test(rowData) && !/michael|sacha|cederic|axel|zoe|ferre/i.test(rowData) && rowData.length > 10) {
                        eersteOpen = rowData;
                    }
                });

                document.getElementById('data').innerHTML = mijnShiften.length > 0 
                    ? mijnShiften.map(s => `<div class="shift-item">${s}</div>`).join('') 
                    : '<p>Geen shiften gevonden.</p>';
                
                document.getElementById('banner').innerText = eersteOpen ? '🔥 Volgende open: ' + eersteOpen : '✅ Alles volgeboekt!';
            });
    </script>
</body>
</html>
